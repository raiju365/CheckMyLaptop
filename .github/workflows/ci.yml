name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m checkmylaptop --demo --cli --json demo-report.json
      - name: Smoke-test Windows collectors
        if: runner.os == 'Windows'
        run: python tests/windows_smoke.py
