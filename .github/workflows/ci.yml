name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m checkmylaptop --demo --cli --json demo-report.json
      - uses: actions/setup-go@v5
        if: runner.os == 'Windows'
        with:
          go-version: "1.25.x"
          cache: false
      - name: Build the native performance collector
        if: runner.os == 'Windows'
        working-directory: native/performance
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o ../../build/checkmylaptop-performance.exe .
      - name: Smoke-test Windows collectors
        if: runner.os == 'Windows'
        run: python tests/windows_smoke.py --require-native
